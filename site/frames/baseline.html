<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>baseline</title><link rel="stylesheet" href="visual-frame.css"><script src="../assets/gsap.min.js"></script></head><body><div id="root" data-composition-id="baseline" data-width="1280" data-height="430" data-duration="18"><div id="baseline-clip" class="clip" data-start="0" data-duration="18" data-track-index="0"><div class="stage "><div class="chart"><span>Before travel training</span><div class="track"><div class="bar before" style="width:74.75%"></div></div><strong>74.75%</strong></div><div class="chart after"><span>After travel training</span><div class="track"><div class="bar" style="width:93.63%"></div></div><strong>93.63%</strong></div><p class="context">Same 800 practice questions</p></div></div></div><script>const ID='baseline';const tl=gsap.timeline({paused:true});tl.fromTo('.bar',{scaleX:0},{scaleX:1,duration:2,stagger:3,ease:'power2.out'},.5).fromTo('.after strong',{opacity:0},{opacity:1,duration:.6},4);tl.to({},{duration:1},17);window.__timelines={};window.__timelines[ID]=tl;function report(){document.getElementById('root').dataset.playbackRate=tl.timeScale();document.getElementById('root').dataset.playbackTime=tl.time().toFixed(2)}tl.eventCallback('onUpdate',report);window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;const c=e.data?.command;if(e.data.rate)tl.timeScale(Number(e.data.rate));if(c==='play')tl.play();if(c==='pause')tl.pause();if(c==='reset')tl.restart();if(c==='seek')tl.pause(Math.max(0,Math.min(18,Number(e.data.time)||0)));report()});document.addEventListener('keydown',e=>{if(['p','r'].includes(e.key.toLowerCase())){e.preventDefault();parent.postMessage({type:'frame-key',key:e.key.toLowerCase()},location.origin)}});document.fonts.ready.then(()=>parent.postMessage({type:'frame-ready',id:ID},location.origin));</script></body></html>
