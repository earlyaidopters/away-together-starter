<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>testing</title><link rel="stylesheet" href="visual-frame.css"><script src="../assets/gsap.min.js"></script></head><body><div id="root" data-composition-id="testing" data-width="1280" data-height="430" data-duration="18"><div id="testing-clip" class="clip" data-start="0" data-duration="18" data-track-index="0"><div class="stage "><div class="paper">Unseen examples</div><div class="row"><div class="column step"><div class="model">Original model</div></div><div class="column step"><div class="model">Your trained model</div></div></div><div class="paper step">Compare both answers with the checked label.</div></div></div></div><script>const ID='testing';const tl=gsap.timeline({paused:true});tl.fromTo('.step',{opacity:0,x:18},{opacity:1,x:0,duration:.7,stagger:2},.6);tl.to({},{duration:1},17);window.__timelines={};window.__timelines[ID]=tl;function report(){document.getElementById('root').dataset.playbackRate=tl.timeScale();document.getElementById('root').dataset.playbackTime=tl.time().toFixed(2)}tl.eventCallback('onUpdate',report);window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;const c=e.data?.command;if(e.data.rate)tl.timeScale(Number(e.data.rate));if(c==='play')tl.play();if(c==='pause')tl.pause();if(c==='reset')tl.restart();if(c==='seek')tl.pause(Math.max(0,Math.min(18,Number(e.data.time)||0)));report()});document.addEventListener('keydown',e=>{if(['p','r'].includes(e.key.toLowerCase())){e.preventDefault();parent.postMessage({type:'frame-key',key:e.key.toLowerCase()},location.origin)}});document.fonts.ready.then(()=>parent.postMessage({type:'frame-ready',id:ID},location.origin));</script></body></html>
