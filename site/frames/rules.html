<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rules</title><style>@font-face{font-family:Poppins;src:url(assets/Poppins-ExtraBold.ttf);font-weight:800}*{box-sizing:border-box}html,body{margin:0;font-family:Arial,sans-serif;color:#203d36;background:transparent}#root{width:100%;height:100%}.stage{padding:12px;display:flex;flex-direction:column;gap:20px}.sentence{font:800 24px/1.35 Poppins;text-align:center;padding:20px;background:#fff;border:2px solid #becdb5;border-radius:12px}.lanes{display:grid;grid-template-columns:1fr 1fr;gap:25px}.lane{padding:20px;border:2px solid #bdccb3;border-radius:14px;background:#fff}.lane h2{font:800 24px Poppins;margin:0 0 14px}.lane p{font-size:20px;line-height:1.4;margin:10px 0}.training{background:#e3edda}.verdict{font:800 28px Poppins;color:#843f2c}.gates{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center}.gate-list{display:grid;gap:12px}.gate{padding:15px 20px;border:2px solid #b6c7a9;border-radius:9px;background:#fff;display:flex;justify-content:space-between;gap:20px;font-size:22px}.fail{background:#f1ded3;border-color:#b98269}.result{border-left:6px solid #b98269;padding:22px;text-align:left}.result h2{font:800 34px Poppins;margin:0 0 15px}.result p{font-size:22px;line-height:1.4;margin:10px 0}.end{text-align:center;font-size:18px;margin:5px 0}@media(max-width:600px){.lanes,.gates{grid-template-columns:1fr;gap:16px}.sentence{font-size:21px;padding:16px}.lane{padding:16px}.lane h2{font-size:21px}.lane p{font-size:18px}.gate{font-size:18px;padding:15px}.result h2{font-size:28px}.result p{font-size:19px}.stage{gap:16px}}</style><script src="assets/gsap.min.js"></script></head><body><div id="root" data-composition-id="rules" data-width="1280" data-height="360" data-duration="18"><div id="rules-clip" class="clip" data-start="0" data-duration="18" data-track-index="0"><div class="stage"><div class="gates"><div class="gate-list"><div class="gate step"><span>Budget</span><strong>Pass</strong></div><div class="gate step"><span>Written terms</span><strong>Pass</strong></div><div class="gate fail step"><span>Entrance stairs</span><strong>Fail</strong></div></div><div class="result step"><h2>Decline</h2><p>Open the photo and the reason.</p><p>A person checks unresolved access.</p></div></div><p class="end">Missing evidence → review. A green card is not a booking guarantee.</p></div></div></div><script>const ID='rules';const tl=gsap.timeline({paused:true});tl.fromTo('.step',{opacity:0,y:16},{opacity:1,y:0,duration:.7,stagger:2.5},0).fromTo('.end',{opacity:0},{opacity:1,duration:.6},10).to({},{duration:7.4},10.6);window.__timelines = {};window.__timelines['rules'] = tl;window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;const c=e.data?.command;if(e.data.rate){tl.timeScale(Number(e.data.rate));document.getElementById('root').dataset.playbackRate=tl.timeScale();}if(c==='play')tl.play();if(c==='pause')tl.pause();if(c==='reset')tl.restart();if(c==='seek')tl.pause(Math.max(0,Math.min(18,Number(e.data.time)||0)))});document.addEventListener('keydown',e=>{if(['p','r'].includes(e.key.toLowerCase())){e.preventDefault();parent.postMessage({type:'frame-key',key:e.key.toLowerCase()},location.origin)}});tl.eventCallback('onUpdate',()=>{document.getElementById('root').dataset.playbackRate=tl.timeScale();document.getElementById('root').dataset.playbackTime=tl.time().toFixed(2)});document.fonts.ready.then(()=>parent.postMessage({type:'frame-ready',id:ID},location.origin));</script></body></html>
