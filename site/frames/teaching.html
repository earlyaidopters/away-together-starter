<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Labeled examples teach the reader</title><style>@font-face{font-family:Poppins;src:url(../assets/Poppins-ExtraBold.ttf);font-weight:800}*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,sans-serif;color:#203d36}#root{width:100%;height:100%}.stage{padding:20px 12px;display:flex;flex-direction:column;justify-content:center;min-height:310px;gap:35px}.row{display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr;gap:12px;align-items:center}.tile{border:2px solid #b6c7a9;border-radius:16px;background:#fff;padding:26px 18px;min-height:195px;display:flex;flex-direction:column;justify-content:center;text-align:center}.tile b{font:800 23px/1.4 Poppins;display:block}.tile span{font-size:21px;line-height:1.4;display:block;margin-top:22px}.arrow{font-size:34px;text-align:center}.arrow:before{content:'→'}.tile img{width:100%;height:115px;object-fit:cover;border-radius:7px;margin-top:12px}.final{background:#dceacd}.end{text-align:center;font-size:20px;margin:0}.dark{color:#f3f5ef}.dark .tile{color:#203d36}.red{background:#f2ddd3;border-color:#bd7b62}@media(max-width:600px){.stage{padding:8px;gap:20px}.row{grid-template-columns:1fr;gap:8px}.tile{min-height:130px;padding:18px}.tile b{font-size:20px}.tile span{font-size:18px;margin-top:10px}.arrow{font-size:24px}.arrow:before{content:'↓'}.end{font-size:18px}.tile img{height:100px}}</style><script src="../assets/gsap.min.js"></script></head><body><div id="root" data-composition-id="teaching" data-width="1280" data-height="360" data-duration="18"><div id="teaching-clip" class="clip" data-start="0" data-duration="18" data-track-index="0"><div class="stage "><div class="row"><div class="tile step  "><b>“Full refund to your card.”</b><span>Cash back</span></div><div class="arrow step" aria-label="then"></div><div class="tile step  "><b>“Credit toward a future stay.”</b><span>Hotel credit</span></div><div class="arrow step" aria-label="then"></div><div class="tile step final "><b>“Contact reception.”</b><span>Can’t tell</span></div></div><p class="end">Travel examples → a reader with a narrower job</p></div></div></div><script>const ID='teaching';const tl=gsap.timeline({paused:true});tl.fromTo('.step',{opacity:0,y:16},{opacity:1,y:0,duration:.7,stagger:2},0).fromTo('.end',{opacity:0},{opacity:1,duration:.6},10).to({},{duration:7.4},10.6);window.__timelines = {};window.__timelines['teaching'] = tl;window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;const c=e.data?.command;if(c==='play')tl.play();if(c==='pause')tl.pause();if(c==='reset')tl.restart();if(c==='seek')tl.pause(Math.max(0,Math.min(18,Number(e.data.time)||0)))});document.addEventListener('keydown',e=>{if(['p','r'].includes(e.key.toLowerCase())){e.preventDefault();parent.postMessage({type:'frame-key',key:e.key.toLowerCase()},location.origin)}});document.fonts.ready.then(()=>parent.postMessage({type:'frame-ready',id:ID},location.origin));</script></body></html>
