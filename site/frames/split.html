<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>split</title><link rel="stylesheet" href="visual-frame.css"><script src="../assets/gsap.min.js"></script></head><body><div id="root" data-composition-id="split" data-width="1280" data-height="430" data-duration="18"><div id="split-clip" class="clip" data-start="0" data-duration="18" data-track-index="0"><div class="stage "><div class="row"><div class="column"><div class="paper">Checked examples<i></i><i></i><i></i></div></div><div class="arrow">→</div><div class="column step"><div class="folder"><div class="paper">Learn<i></i><i></i></div><b>Practice</b></div></div><div class="column step"><div class="folder"><div class="paper">Compare<i></i><i></i></div><b>Choose settings</b></div></div><div class="column step"><div class="folder sealed"><div class="seal">▣</div><b>Final test</b><p>Keep closed until ready</p></div></div></div></div></div></div><script>const ID='split';const tl=gsap.timeline({paused:true});tl.fromTo('.step',{opacity:0,y:28},{opacity:1,y:0,duration:.8,stagger:2.2},1);tl.to({},{duration:1},17);window.__timelines={};window.__timelines[ID]=tl;function report(){document.getElementById('root').dataset.playbackRate=tl.timeScale();document.getElementById('root').dataset.playbackTime=tl.time().toFixed(2)}tl.eventCallback('onUpdate',report);window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;const c=e.data?.command;if(e.data.rate)tl.timeScale(Number(e.data.rate));if(c==='play')tl.play();if(c==='pause')tl.pause();if(c==='reset')tl.restart();if(c==='seek')tl.pause(Math.max(0,Math.min(18,Number(e.data.time)||0)));report()});document.addEventListener('keydown',e=>{if(['p','r'].includes(e.key.toLowerCase())){e.preventDefault();parent.postMessage({type:'frame-key',key:e.key.toLowerCase()},location.origin)}});document.fonts.ready.then(()=>parent.postMessage({type:'frame-ready',id:ID},location.origin));</script></body></html>
